[project]
name = "review-desk"
version = "0.1.0"
description = "Local async approval desk for agent drafts: review packets in a browser, decisions on disk"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["markdown>=3.5,<4"]

[project.scripts]
review-desk = "review_desk.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
